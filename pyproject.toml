[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-qwen"
version = "0.1.0"
description = "Centroid Steering Experiment — conditional activation steering for Qwen2.5-Coder-7B on Intel Arc (jlens-qwen package)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "transformers>=4.44.0",
  "accelerate>=0.33.0",
  "huggingface_hub>=0.24.0",
  "safetensors>=0.4.0",
  "numpy>=1.26.0",
  "psutil>=5.9.0",
  "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest-benchmark"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "research", "experiments"]
markers = [
  "gate0: hardware readiness",
  "gate1: model load and inference",
  "gate2: logit lens math",
  "gate3: jacobian fit",
  "gate4: j-lens apply",
  "gate5: workspace boundary",
  "gate6: abstract concepts",
  "gate7: speed optimization",
  "slow: long-running tests",
]
